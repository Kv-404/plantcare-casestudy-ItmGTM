<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlantCare — October pilot</title>
<style>
  :root {
    --ink: #1b2420;
    --muted: #5d6b63;
    --forest: #143528;
    --leaf: #1e6b43;
    --line: #e3ddd2;
    --paper: #f6f3ec;
    --card: #fffdf8;
    --sage: #e7f0e8;
    --sand: #f8efe6;
    --clay: #9a4632;
    --gold: #8a6230;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
  aside {
    background: var(--forest);
    color: #f6f3ec;
    padding: 22px 14px 16px;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow: auto;
  }
  .brand { font-family: Georgia, "Iowan Old Style", serif; font-size: 28px; padding: 0 8px; line-height: 1; }
  .brand small {
    display: block; margin-top: 8px;
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #b7d4c4;
  }
  nav { display: flex; flex-direction: column; gap: 2px; margin-top: 28px; }
  nav button {
    text-align: left; background: transparent; border: 0; color: #e7f2eb;
    border-radius: 10px; padding: 8px 12px; font-size: 15px;
  }
  nav button span { display: block; margin-top: 2px; font-size: 12px; color: #b7d4c4; }
  nav button[aria-current="page"] { background: #1e6b43; color: white; }
  nav button[aria-current="page"] span { color: #e4f3ea; }
  nav button:hover { background: rgba(255,255,255,0.07); }
  .aside-foot { margin-top: auto; padding: 12px 10px 4px; font-size: 13px; line-height: 1.45; color: #c9ddd2; }
  .foot-short { display: none; }
  main { padding: 28px 32px 72px; max-width: 1180px; }
  h1 { font-family: Georgia, serif; font-weight: 500; font-size: 34px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .lede { color: var(--muted); margin: 0 0 18px; line-height: 1.45; max-width: 640px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 14px;
  }
  .k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .v { font-family: Georgia, serif; font-size: 32px; margin-top: 6px; letter-spacing: -0.03em; }
  .s { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.4; }
  .board { display: grid; grid-template-columns: 1.25fr 0.75fr; gap: 14px; margin-top: 14px; }
  .stop { display: grid; grid-template-columns: 72px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .stop:first-of-type { border-top: 0; }
  .flat { font-family: Georgia, serif; font-size: 16px; }
  .zones { display: grid; gap: 10px; }
  .zone h3 { margin: 4px 0; font-size: 18px; font-family: Georgia, serif; font-weight: 500; }
  .zone.wait { background: var(--sand); }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; background: var(--sage); color: var(--leaf); }
  .pill.paused, .pill.late { background: #f3ead4; color: var(--gold); }
  .pill.unpaid, .pill.failed, .pill.hold { background: #f8e6e1; color: var(--clay); }
  .pill.waitlist { background: #eceae4; color: #5c584e; }
  .pill.done { background: var(--sage); color: var(--leaf); }
  .pill.scheduled { background: #e7eef4; color: #23405f; }
  .meter { display: flex; gap: 5px; margin: 10px 0 6px; }
  .tick { flex: 1; height: 28px; border-radius: 4px; background: #e6ebe4; max-width: 28px; }
  .tick.on { background: var(--leaf); }
  .tick.hot { background: var(--clay); }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .choice {
    text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px;
  }
  .choice.on { border-color: var(--leaf); background: var(--sage); }
  .choice b { display: block; font-size: 16px; }
  .choice span { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  label.f { display: block; font-size: 13px; margin-bottom: 4px; color: var(--muted); }
  input, select, textarea {
    width: 100%; border: 1px solid var(--line); background: white; border-radius: 10px; padding: 10px 12px;
  }
  textarea { min-height: 78px; resize: vertical; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { background: var(--leaf); color: white; border: 0; border-radius: 10px; padding: 10px 14px; }
  .btn.secondary { background: white; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: white; color: var(--clay); border: 1px solid #e7cfc8; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .split { display: grid; grid-template-columns: 340px 1fr; gap: 16px; align-items: start; }
  .split > article.card { position: sticky; top: 16px; }
  [hidden] { display: none !important; }
  .people { display: flex; flex-direction: column; gap: 6px; max-height: 70vh; overflow: auto; }
  .person {
    text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  }
  .person.on { border-color: var(--leaf); background: #f3f8f4; }
  .person b { display: block; }
  .check {
    display: flex; gap: 10px; align-items: center;
    margin: 8px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: white; font-size: 16px;
  }
  .check input { width: 18px; height: 18px; }
  .note, .warn { border-radius: 12px; padding: 12px 14px; line-height: 1.45; margin: 12px 0; }
  .note { background: var(--sage); }
  .warn { background: var(--sand); }
  .bar-row { display: grid; grid-template-columns: 150px 1fr 110px; gap: 10px; align-items: center; margin: 8px 0; }
  .bar { height: 14px; background: #e6ebe4; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--leaf); border-radius: 99px; }
  .bar.mid i { background: #7d9a62; }
  .bar.low i { background: var(--clay); }
  .toast {
    position: fixed; right: 16px; bottom: 16px; max-width: 340px;
    background: var(--forest); color: white; padding: 12px 14px; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(20,40,30,0.18);
  }
  .search { margin-bottom: 10px; }
  .guide { background: #e7f0e8; border: 1px solid #d3e4d8; border-radius: 14px; padding: 14px 16px; margin: 0 0 16px; line-height: 1.5; }
  .guide p { margin: 6px 0 0; }
  .guide .k { color: var(--leaf); }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 16px; }
  button.step { text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  button.step:hover { border-color: var(--leaf); }
  button.step .n { font-size: 12px; letter-spacing: 0.06em; color: var(--leaf); }
  button.step b { display: block; margin: 3px 0 4px; font-size: 16px; }
  button.step span { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .status-line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin: 8px 0; }
  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    aside { position: sticky; height: auto; z-index: 2; }
    nav { flex-direction: row; flex-wrap: wrap; overflow: visible; margin-top: 12px; gap: 4px; }
    nav button { white-space: nowrap; padding: 8px 10px; flex: 1 1 30%; text-align: center; }
    main { padding: 18px 14px 56px; }
    .stats, .board, .split, form .row, .choices { grid-template-columns: 1fr; }
    .split > article.card { position: static; }
    aside { padding: 12px 12px 8px; }
    .brand { font-size: 26px; }
    nav { margin-top: 10px; }
    .aside-foot { margin-top: 8px; padding: 0 8px 2px; font-size: 12px; }
    .foot-long { display: none; }
    .foot-short { display: inline; }
    h1 { font-size: 28px; }
    .people { max-height: none; }
    .steps { grid-template-columns: 1fr; }
    nav button span { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">PlantCare<small>Case 57 · October pilot</small></div>
    <nav>
      <button data-view="today" aria-current="page">Today<span>This Friday</span></button>
      <button data-view="book">Book<span>Take ₹399</span></button>
      <button data-view="customers">Customers<span>Care cards</span></button>
      <button data-view="route">Route<span>The day's 14</span></button>
      <button data-view="visit">Visit<span>Close a stop</span></button>
      <button data-view="numbers">Numbers<span>The ₹229</span></button>
    </nav>
    <div class="aside-foot"><span class="foot-long">One technician, Ravi. Two buildings inside 3 km. 14 visits a day. Read the green note on each screen. The folder README walks through the case.</span><span class="foot-short">Ravi · 14 visits a day · ₹229 each. Read the green note.</span></div>
  </aside>
  <main id="main"></main>
</div>
<div id="toast" class="toast" hidden></div>
<script>
const KEY = "plantcare-case57-v2";
const TODAY = "2026-10-02";
const PRICE = 399, COST = 170, CONTRIB = 229, CAP = 14, DAYS = 26, POOL = 182 * 170;
const SOCIETIES = {
  "Maple Residency": { day: 4, dayName: "Thursday", active: true },
  "Cedar Heights": { day: 5, dayName: "Friday", active: true }
};

function c(id, name, society, flat, plants, access, status, note) {
  return { id, name, society, flat, plants, access, status, note, phone: "" };
}
function pair(customerId, a, b) {
  const blank = { status: "scheduled", note: "", water: false, prune: false, pest: false, photo: false };
  return [
    Object.assign({ id: customerId + "-a", customerId, date: a }, blank),
    Object.assign({ id: customerId + "-b", customerId, date: b }, blank)
  ];
}
function seed() {
  return {
    seq: 40,
    customers: [
      c("c1", "Ananya Rao", "Maple Residency", "A-1204", 8, "Guard list, maid after 11", "active", "Eight plants. Do not move the money plant."),
      c("c2", "Rohan Mehta", "Maple Residency", "A-0903", 5, "Balcony latch with neighbour 904", "active", ""),
      c("c3", "Kavya Iyer", "Maple Residency", "B-0502", 12, "Evening only, after 6 pm", "active", "Twelve plants. The visit runs long."),
      c("c4", "Suresh Rao", "Maple Residency", "C-0201", 15, "Son pays. Key with the guard.", "active", "Older resident. Call the son if access fails."),
      c("c5", "Imran Qureshi", "Maple Residency", "B-1102", 6, "Key with the guard", "active", ""),
      c("c6", "Meera Joshi", "Maple Residency", "A-0610", 6, "Shoe covers required", "active", ""),
      c("c7", "Neha Kapoor", "Cedar Heights", "T2-0404", 9, "Maid opens 10 to 1", "active", ""),
      c("c8", "Arjun Desai", "Cedar Heights", "T1-0707", 4, "Balcony, no one home needed", "active", ""),
      c("c9", "Fatima Sheikh", "Cedar Heights", "T3-0101", 11, "Guard list", "active", ""),
      c("c10", "Harish Gupta", "Cedar Heights", "T3-0804", 10, "Key in the meter cupboard", "active", ""),
      c("c11", "Vikram Nair", "Cedar Heights", "T2-1501", 7, "Owner is home", "paused", "Home all October and watering the plants himself."),
      c("c12", "Priya Menon", "Cedar Heights", "T1-0303", 8, "Maid", "unpaid", "October payment did not clear."),
      c("c13", "Dev Patel", "Lakeview Towers", "L-0902", 7, "Guard", "waitlist", "Outside the 3 km zone.")
    ],
    visits: [
      ...pair("c1", "2026-10-08", "2026-10-22"),
      ...pair("c2", "2026-10-08", "2026-10-22"),
      ...pair("c3", "2026-10-08", "2026-10-22"),
      ...pair("c4", "2026-10-08", "2026-10-22"),
      ...pair("c5", "2026-10-08", "2026-10-22"),
      ...pair("c6", "2026-10-08", "2026-10-22"),
      ...pair("c7", "2026-10-09", "2026-10-23"),
      ...pair("c8", "2026-10-09", "2026-10-23"),
      ...pair("c9", "2026-10-09", "2026-10-23"),
      ...pair("c10", "2026-10-09", "2026-10-23")
    ]
  };
}

let state = load();
let view = "today";
let selectedCustomer = null;
let selectedVisit = null;
let routeDate = "2026-10-08";
let query = "";
let societyPick = "Maple Residency";

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return seed();
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }
function uid(prefix) { state.seq += 1; return prefix + state.seq; }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function inr(n) {
  const sign = n < 0 ? "−" : "";
  return sign + "₹" + Math.abs(Math.round(n)).toLocaleString("en-IN");
}
function pretty(iso) {
  return new Date(iso + "T12:00:00").toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
}
function addDays(iso, n) {
  const d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
}
function customer(id) { return state.customers.find((x) => x.id === id); }
function activeCustomers() { return state.customers.filter((x) => x.status === "active"); }
function liveVisits(date) { return state.visits.filter((v) => v.date === date && v.status !== "cancelled"); }
function toast(msg) {
  const el = document.getElementById("toast");
  el.hidden = false;
  el.textContent = msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 3400);
}
function nextWeekday(fromIso, weekday) {
  const d = new Date(fromIso + "T12:00:00");
  d.setDate(d.getDate() + 1);
  while (d.getDay() !== weekday) d.setDate(d.getDate() + 1);
  return d.toISOString().slice(0, 10);
}
function placeOn(preferred) {
  let iso = preferred;
  for (let i = 0; i < 6; i++) {
    if (liveVisits(iso).length < CAP) return iso;
    iso = addDays(iso, 7);
  }
  return null;
}
function schedulePair(customerId, society) {
  const meta = SOCIETIES[society];
  const first = placeOn(nextWeekday(TODAY, meta.day));
  if (!first) return null;
  const second = placeOn(addDays(first, 14));
  if (!second) return null;
  const blank = { status: "scheduled", note: "", water: false, prune: false, pest: false, photo: false };
  state.visits.push(
    Object.assign({ id: uid("v"), customerId, date: first }, blank),
    Object.assign({ id: uid("v"), customerId, date: second }, blank)
  );
  return [first, second];
}
function cancelFuture(customerId) {
  state.visits.forEach((v) => {
    if (v.customerId === customerId && v.status === "scheduled" && v.date >= TODAY) v.status = "cancelled";
  });
}
function meter(count) {
  const cls = count >= CAP ? "hot" : "on";
  return `<div class="meter" aria-label="${count} of ${CAP} visits">${Array.from({ length: CAP }, (_, i) => `<span class="tick ${i < count ? cls : ""}"></span>`).join("")}</div>`;
}
function pill(status) { return `<span class="pill ${esc(status)}">${esc(status)}</span>`; }
function late(access) { return /evening|after 6/i.test(access || ""); }
function guide(kicker) {
  const paras = Array.prototype.slice.call(arguments, 1).map((p) => "<p>" + p + "</p>").join("");
  return '<div class="guide"><div class="k">' + kicker + "</div>" + paras + "</div>";
}
function statusHelp(status) {
  return {
    active: "Paid. Both visits stay on the route, and this flat is inside the ₹229.",
    paused: "Home this month. Later visits come off the route, and this flat is left out of the paying count.",
    unpaid: "The ₹399 did not clear. Visits stay off until the payment is taken again.",
    waitlist: "This building is outside the 3 km zone. The name is kept, and no visit is placed."
  }[status] || "";
}

function render() {
  document.querySelectorAll("nav button").forEach((b) => {
    b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false");
  });
  document.getElementById("main").innerHTML = ({
    today: viewToday, book: viewBook, customers: viewCustomers,
    route: viewRoute, visit: viewVisit, numbers: viewNumbers
  })[view]();
  bind();
  save();
}

function viewToday() {
  const active = activeCustomers();
  const upcoming = state.visits.filter((v) => v.status === "scheduled" && v.date >= TODAY).sort((a, b) => a.date.localeCompare(b.date));
  const nextDate = upcoming[0] ? upcoming[0].date : null;
  const stops = nextDate ? liveVisits(nextDate).slice().sort((a, b) => customer(a.customerId).flat.localeCompare(customer(b.customerId).flat, undefined, { numeric: true })) : [];
  const maple = active.filter((x) => x.society === "Maple Residency").length;
  const cedar = active.filter((x) => x.society === "Cedar Heights").length;
  const wait = state.customers.filter((x) => x.status === "waitlist").length;
  const routeSociety = stops.length ? [...new Set(stops.map((v) => customer(v.customerId).society))].join(", ") : "";
  const stopHtml = stops.map((v) => {
    const cust = customer(v.customerId);
    if (!cust || cust.status === "hold") return "";
    return `<div class="stop"><div class="flat">${esc(cust.flat)}</div><div><b>${esc(cust.name)}</b><div class="s">${esc(cust.access)}</div></div><div>${pill(v.status)}${late(cust.access) ? ' <span class="pill late">late stop</span>' : ""}</div></div>`;
  }).join("") || `<p class="s">No stops on the next route day.</p>`;
  return `
    <h1>Friday 2 October</h1>
    <p class="lede">Ravi has no stops today. ${nextDate ? "The next route is " + pretty(nextDate) + ", " + stops.length + " of " + CAP + ", in " + routeSociety + "." : "Nothing is booked."}</p>
    ${guide("What this screen is", "PlantCare sends one technician to water and check plants for people who are at the office. The price is <strong>₹399 a month</strong> for <strong>two visits</strong>. The service costs <strong>₹170</strong>, so each paying subscriber contributes <strong>₹229</strong>. This Friday is 2 October 2026. Maple is served on Thursday and Cedar on Friday, so today is empty on purpose and the work starts Thursday 8 October.")}
    <div class="steps">
      <button class="step" type="button" data-go="customers"><div class="n">1 · LOOK UP A FLAT</div><b>Customers</b><span>Open Ananya Rao. Then search Kavya. Her flat can be reached only after 6 pm.</span></button>
      <button class="step" type="button" data-go="book"><div class="n">2 · TAKE A PAYMENT</div><b>Book</b><span>Add a Maple flat and it lands on a Thursday. A building outside the zone stays on the waitlist.</span></button>
      <button class="step" type="button" data-go="route"><div class="n">3 · SEE THE CAP</div><b>Route</b><span>${nextDate ? pretty(nextDate) + " holds " + stops.length + " of 14 stops." : "No route is booked."} Fill the day, then book again and the new flat moves a week later.</span></button>
      <button class="step" type="button" data-go="visit"><div class="n">4 · DO THE VISIT</div><b>Visit</b><span>Water, prune, pest check, photo, and a note. The visit stays open until all five are done.</span></button>
      <button class="step" type="button" data-go="numbers"><div class="n">5 · READ THE MONEY</div><b>Numbers</b><span>₹229 is true when Ravi is paid per visit. A full-route salary loses money at this size.</span></button>
      <button class="step" type="button" data-go="customers"><div class="n">6 · PAUSE A MONTH</div><b>Vikram is already paused</b><span>Search Vikram. He is home in October, so he is off the route and out of the paying count.</span></button>
    </div>
    <div class="stats">
      <article class="card"><div class="k">Paying subscribers</div><div class="v">${active.length}</div><div class="s">${active.length} of 40 for day 30. Paused and unpaid stay off this count.</div></article>
      <article class="card"><div class="k">Contribution this month</div><div class="v">${inr(active.length * CONTRIB)}</div><div class="s">${active.length} × ₹229, on per-visit pay.</div></article>
      <article class="card"><div class="k">Visits still booked</div><div class="v">${upcoming.length}</div><div class="s">Two visits for each paying subscriber.</div></article>
      <article class="card"><div class="k">Next day</div><div class="v">${stops.length}/${CAP}</div><div class="s">${nextDate ? pretty(nextDate) : "—"}</div></article>
    </div>
    <div class="board">
      <article class="card">
        <div class="k">${nextDate ? pretty(nextDate) + " · " + esc(routeSociety) : "Route"}</div>
        <h2 style="font-family:Georgia,serif;font-weight:500;margin:6px 0 8px">Stops on the next route</h2>
        ${stopHtml}
      </article>
      <div class="zones">
        <article class="card zone"><div class="k">Active · Thursday</div><h3>Maple Residency</h3><p class="s">${maple} paying subscribers. One building, one weekday.</p></article>
        <article class="card zone"><div class="k">Active · Friday</div><h3>Cedar Heights</h3><p class="s">${cedar} paying subscribers. Same 3 km pocket.</p></article>
        <article class="card zone wait"><div class="k">Outside the zone</div><h3>Waitlist</h3><p class="s">${wait} ${wait === 1 ? "name" : "names"}. Kept off the route.</p></article>
      </div>
    </div>`;
}

function viewBook() {
  const other = societyPick === "other";
  return `
    <h1>Book a subscription</h1>
    <p class="lede">₹399 for the month, two visits. Maple and Cedar go on Ravi’s route. Any other society is a waitlist name.</p>
    ${guide("What happens when you book", "The ₹399 is taken first. Maple visits go on <strong>Thursday</strong> and Cedar visits go on <strong>Friday</strong>, about two weeks apart. A day stops at 14 stops, and a new flat then moves to the next open week. Choose <strong>Another society</strong> for a building outside the 3 km zone: the name is saved, and no visit is placed.")}
    <div class="choices">
      <button type="button" class="choice ${societyPick === "Maple Residency" ? "on" : ""}" data-soc="Maple Residency"><b>Maple Residency</b><span>Thursday route · inside the zone</span></button>
      <button type="button" class="choice ${societyPick === "Cedar Heights" ? "on" : ""}" data-soc="Cedar Heights"><b>Cedar Heights</b><span>Friday route · inside the zone</span></button>
      <button type="button" class="choice ${other ? "on" : ""}" data-soc="other"><b>Another society</b><span>Waitlist. Off the route.</span></button>
    </div>
    <form id="book" class="card">
      <div class="row">
        <div><label class="f" for="name">Name</label><input id="name" required placeholder="Ananya Rao"></div>
        <div><label class="f" for="phone">Phone</label><input id="phone" placeholder="Optional"></div>
      </div>
      ${other ? `<div class="row"><div><label class="f" for="other">Society name</label><input id="other" placeholder="Lakeview Towers" required></div></div>` : ""}
      <div class="row">
        <div><label class="f" for="flat">Tower and flat</label><input id="flat" required placeholder="A-1204"></div>
        <div><label class="f" for="plants">Plant count</label><input id="plants" type="number" min="1" value="6" required></div>
      </div>
      <label class="f" for="access">How Ravi gets in</label>
      <input id="access" required placeholder="Guard list, maid after 11" style="margin-bottom:12px">
      <label class="f" for="note">Care note</label>
      <textarea id="note" placeholder="Anything the visit must not get wrong"></textarea>
      <div class="actions" style="margin-top:14px"><button class="btn" type="submit">Take ₹399 and book</button></div>
      <p class="s">Try a Maple flat such as Z-0101, then try Lakeview Towers under Another society and compare the two care cards.</p>
    </form>`;
}

function viewCustomers() {
  const list = state.customers.filter((cust) => cust.status !== "hold").filter((cust) => {
    const blob = (cust.name + " " + cust.society + " " + cust.flat + " " + cust.status).toLowerCase();
    return blob.includes(query.toLowerCase());
  });
  if (!list.some((cust) => cust.id === selectedCustomer)) selectedCustomer = list[0] ? list[0].id : null;
  const people = list.map((cust) => `
    <button type="button" class="person ${cust.id === selectedCustomer ? "on" : ""}" data-id="${esc(cust.id)}">
      <b>${esc(cust.name)}</b>
      <span class="s">${esc(cust.flat)} · ${esc(cust.society)}</span>
      <span style="display:inline-block;margin-top:6px">${pill(cust.status)}</span>
    </button>`).join("") || `<p class="s">No resident matches.</p>`;
  const sel = selectedCustomer ? customer(selectedCustomer) : null;
  const countLine = query
    ? (list.length === 1 ? "1 record matches this search." : list.length + " records match this search.")
    : list.length + " " + (list.length === 1 ? "record" : "records") + " on the books. The flat is the route key.";
  return `
    <h1>Customer records</h1>
    <p class="lede">${countLine}</p>
    ${guide("How to read a care card", "The flat is the route key. The access line is how Ravi gets in. The note is what the visit must get right. <strong>Active</strong> counts in the money. <strong>Paused</strong> and <strong>unpaid</strong> drop off the route. <strong>Waitlist</strong> is a building outside the zone. Search <strong>Kavya</strong> for an evening-only flat, <strong>Vikram</strong> for a paused month, and <strong>Dev</strong> for the waitlist.")}
    <div class="split">
      <div>
        <input class="search" id="q" placeholder="Search name, flat, society" value="${esc(query)}">
        <div class="people">${people}</div>
        <button class="btn secondary" id="reset" type="button" style="margin-top:10px">Reset demo data</button>
      </div>
      ${sel ? customerDetail(sel) : ""}
    </div>`;
}

function customerDetail(cust) {
  const visits = state.visits.filter((v) => v.customerId === cust.id && v.status !== "cancelled");
  const vrows = visits.map((v) => `<li>${pretty(v.date)} · ${esc(v.status)}${v.note ? " · " + esc(v.note) : ""}</li>`).join("") || "<li>No visits on the route.</li>";
  return `
    <article class="card">
      <div class="k">Care card</div>
      <h2 style="margin:6px 0;font-family:Georgia,serif;font-weight:500;font-size:28px">${esc(cust.name)}</h2>
      <p>${esc(cust.society)} · ${esc(cust.flat)} · ${esc(cust.plants)} plants</p>
      ${cust.phone ? `<p><strong>Phone.</strong> ${esc(cust.phone)}</p>` : ""}
      <p><strong>Access.</strong> ${esc(cust.access)}</p>
      ${late(cust.access) ? `<p class="warn">This flat is evening-only. A morning batch will miss it unless the route allows a late stop.</p>` : ""}
      ${cust.note ? `<p>${esc(cust.note)}</p>` : ""}
      <p class="status-line">${pill(cust.status)} <span class="s">${statusHelp(cust.status)}</span></p>
      <ul>${vrows}</ul>
      <div class="actions">
        ${cust.status === "active" ? `<button class="btn secondary" data-act="pause" data-id="${esc(cust.id)}" type="button">Pause this month</button><button class="btn danger" data-act="unpaid" data-id="${esc(cust.id)}" type="button">Mark unpaid</button>` : ""}
        ${cust.status === "paused" || cust.status === "unpaid" ? `<button class="btn" data-act="resume" data-id="${esc(cust.id)}" type="button">Take payment and restore</button>` : ""}
        ${cust.status === "waitlist" ? `<p class="s">This society is outside the pilot zone, so the record stays off the route.</p>` : ""}
      </div>
    </article>`;
}

function viewRoute() {
  const dates = [...new Set(state.visits.filter((v) => v.status !== "cancelled").map((v) => v.date))].sort();
  if (dates.length && !dates.includes(routeDate)) routeDate = dates.find((d) => d >= TODAY) || dates[0];
  const options = dates.map((d) => `<option value="${d}" ${d === routeDate ? "selected" : ""}>${pretty(d)}</option>`).join("");
  const list = liveVisits(routeDate).slice().sort((a, b) => (customer(a.customerId).flat || "").localeCompare(customer(b.customerId).flat || "", undefined, { numeric: true }));
  const societies = [...new Set(list.map((v) => customer(v.customerId).society))];
  const rows = list.map((v) => {
    const cust = customer(v.customerId);
    return `<div class="stop"><div class="flat">${esc(cust.flat)}</div><div><b>${esc(cust.name)}</b><div class="s">${esc(cust.plants)} plants · ${esc(cust.access)}</div></div><div>${pill(v.status)}${late(cust.access) ? ' <span class="pill late">late stop</span>' : ""}</div></div>`;
  }).join("") || `<p class="s">No visits this day.</p>`;
  const count = list.length;
  return `
    <h1>Route</h1>
    <p class="lede">One society, one weekday. The day stops at 14.</p>
    ${guide("What the squares mean", "Each square is one stop Ravi can make that day. Green means the stop is already taken. The case cap is <strong>14 visits</strong>, and that number only holds when the stops are in one building. <strong>Fill this day</strong> adds temporary holds so you can see a full day. Holds stay off the customer list and off the ₹229. Book a flat in that building afterwards and the first visit moves to the next open week. <strong>Remove slot holds</strong> clears them.")}
    <div class="actions" style="margin-bottom:12px">
      <label class="f" for="route-date">Day</label>
      <select id="route-date" style="width:auto">${options}</select>
    </div>
    <article class="card">
      <div class="k">${esc(pretty(routeDate))} · ${esc(societies.join(", ") || "empty")}</div>
      ${meter(count)}
      <div class="s">${count} of ${CAP}. ${count >= CAP ? "This day is full. A new flat in this society moves to the next open week." : "Room for " + (CAP - count) + " more stops."}</div>
      ${societies.length > 1 ? `<p class="warn">This day mixes more than one society. Travel will push the real count under 14.</p>` : ""}
      ${rows}
    </article>
    <div class="actions" style="margin-top:12px">
      <button class="btn secondary" id="fill" type="button">Fill this day to the cap</button>
      <button class="btn secondary" id="clear-holds" type="button">Remove slot holds</button>
    </div>`;
}

function viewVisit() {
  const open = state.visits
    .filter((v) => ["scheduled", "done", "failed"].includes(v.status) && customer(v.customerId) && customer(v.customerId).status !== "hold")
    .sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  if (!selectedVisit || !open.some((v) => v.id === selectedVisit)) {
    selectedVisit = (open.find((v) => v.status === "scheduled") || open[0] || {}).id || null;
  }
  const options = open.map((v) => {
    const cust = customer(v.customerId);
    return `<option value="${esc(v.id)}" ${v.id === selectedVisit ? "selected" : ""}>${pretty(v.date)} · ${esc(cust.flat)} · ${esc(cust.name)} · ${esc(v.status)}</option>`;
  }).join("");
  const v = state.visits.find((x) => x.id === selectedVisit);
  if (!v) return `<h1>Visit</h1><p>No visits yet.</p>`;
  const cust = customer(v.customerId);
  const locked = v.status !== "scheduled";
  const box = (id, label) => `<label class="check"><input type="checkbox" id="${id}" ${v[id] ? "checked" : ""} ${locked ? "disabled" : ""}> ${label}</label>`;
  return `
    <h1>Service visit</h1>
    <p class="lede">A visit closes only with the checklist and a photo note. That note is what the resident receives.</p>
    ${guide("What the ₹399 buys", "Water, a light prune, a look for pests, and a photo the same day. Tick all four and write the note, then close the visit. If the door stays shut, write what happened and press <strong>Access failed</strong>. The stop is rebooked on the next Thursday or Friday for that building.")}
    <label class="f" for="pick">Stop</label>
    <select id="pick">${options}</select>
    <article class="card" style="margin-top:12px">
      <div class="k">${esc(cust.society)} · ${esc(cust.flat)}</div>
      <h2 style="margin:6px 0;font-family:Georgia,serif;font-weight:500">${esc(cust.name)}</h2>
      <p>${esc(cust.plants)} plants · ${esc(cust.access)}</p>
      ${cust.note ? `<p>${esc(cust.note)}</p>` : ""}
      <p>${pill(v.status)}</p>
      ${box("water", "Watered")}
      ${box("prune", "Light prune")}
      ${box("pest", "Pest and health look")}
      ${box("photo", "Photo taken")}
      <label class="f" for="vnote">Note the resident will see</label>
      <textarea id="vnote" ${locked ? "disabled" : ""}>${esc(v.note)}</textarea>
      <div class="actions" style="margin-top:12px">
        <button class="btn" id="complete" type="button" ${locked ? "disabled" : ""}>Close visit and send the note</button>
        <button class="btn danger" id="fail" type="button" ${locked ? "disabled" : ""}>Access failed</button>
      </div>
    </article>`;
}

function viewNumbers() {
  const n = activeCustomers().length;
  const real = n ? POOL / n : 0;
  const each = n ? PRICE - real : 0;
  const perDay = (n * 2) / DAYS;
  const row = (label, width, amount, cls) => `
    <div class="bar-row"><div>${label}</div><div class="bar ${cls}"><i style="width:${width}%"></i></div><div><b>${amount}</b></div></div>`;
  return `
    <h1>The case numbers, on this route</h1>
    <p class="lede">Contribution is ₹399 minus ₹170. The cards below use that ₹229, which is the result when Ravi is paid per visit.</p>
    ${guide("Two ways to pay Ravi", "<strong>Per visit.</strong> Cost stays ₹170 for the two visits, so every paying subscriber contributes ₹229 from the first one. The contribution card uses this.", "<strong>Fixed salary.</strong> A full month of 14 visits on 26 working days is 182 subscribers. Paying Ravi as if the route were already full costs 182 × ₹170 = ₹30,940. Spread over the " + n + " people paying now, that is " + (n ? inr(real) : "—") + " each. The fourth card is ₹399 minus that amount. The loss ends near <strong>78 subscribers</strong>, because ₹30,940 ÷ ₹399 is about 78.")}
    <div class="stats">
      <article class="card"><div class="k">Paying now</div><div class="v">${n}</div><div class="s">Day 30 target is 40. Ceiling per technician is 182.</div></article>
      <article class="card"><div class="k">Case contribution</div><div class="v">${inr(n * CONTRIB)}</div><div class="s">${n} × (399 − 170)</div></article>
      <article class="card"><div class="k">Visits this month</div><div class="v">${n * 2}</div><div class="s">${perDay.toFixed(1)} a day if spread over 26 days. Real routes are batched.</div></article>
      <article class="card"><div class="k">Each, if the salary is fixed</div><div class="v">${n ? inr(each) : "—"}</div><div class="s">${n ? "Cost " + inr(real) + " each, against ₹399." : ""}</div></article>
    </div>
    <article class="card" style="margin-top:14px">
      <div class="k">Same technician, three days</div>
      ${row("14 visits · 182 subs", 100, "₹41,678", "")}
      ${row("10 visits · 130 subs", 71, "₹29,770", "mid")}
      ${row("8 visits · 104 subs", 57, "₹23,816", "low")}
      <p>Subscribers per technician = (14 × 26) / 2 = <strong>182</strong>. Contribution at that load = 182 × 229 = <strong>₹41,678</strong>. A scattered day costs the same person ₹17,862. Break-even on a ₹30,940 salary is about <strong>78 subscribers</strong>.</p>
    </article>`;
}

function bind() {
  document.querySelectorAll("[data-go]").forEach((btn) => {
    btn.addEventListener("click", () => { view = btn.dataset.go; render(); });
  });
  document.querySelectorAll("[data-soc]").forEach((btn) => {
    btn.addEventListener("click", () => { societyPick = btn.dataset.soc; render(); });
  });
  const form = document.getElementById("book");
  if (form) {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const flat = document.getElementById("flat").value.trim();
      const plants = Number(document.getElementById("plants").value);
      const access = document.getElementById("access").value.trim();
      const note = document.getElementById("note").value.trim();
      const soc = societyPick === "other" ? document.getElementById("other").value.trim() : societyPick;
      if (!name || !flat || !access || !soc || !plants) { toast("Name, society, flat, plants, and access are required."); return; }
      const id = uid("c");
      const known = !!SOCIETIES[soc];
      state.customers.push({ id, name, society: soc, flat, plants, access, status: known ? "active" : "waitlist", note, phone });
      if (!known) toast(soc + " is outside the zone. " + name + " is on the waitlist.");
      else {
        const dates = schedulePair(id, soc);
        toast(dates ? name + " is booked " + pretty(dates[0]) + " and " + pretty(dates[1]) + "." : "The society days are full for the next six weeks.");
      }
      view = "customers";
      selectedCustomer = id;
      render();
    });
  }
  const q = document.getElementById("q");
  if (q) q.addEventListener("input", () => { query = q.value; render(); const again = document.getElementById("q"); if (again) { again.focus(); again.setSelectionRange(query.length, query.length); } });
  document.querySelectorAll(".person").forEach((btn) => {
    btn.addEventListener("click", () => { selectedCustomer = btn.dataset.id; render(); });
  });
  const onPerson = document.querySelector(".person.on");
  if (onPerson) onPerson.scrollIntoView({ block: "nearest", inline: "nearest" });
  document.querySelectorAll("[data-act]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const cust = customer(btn.dataset.id);
      if (btn.dataset.act === "pause") { cust.status = "paused"; cancelFuture(cust.id); toast(cust.name + " is paused. Future visits are off the route."); }
      if (btn.dataset.act === "unpaid") { cust.status = "unpaid"; cancelFuture(cust.id); toast(cust.name + " is unpaid, so the visits were removed."); }
      if (btn.dataset.act === "resume") {
        if (!SOCIETIES[cust.society]) { toast("This society is outside the zone."); return; }
        cust.status = "active";
        const dates = schedulePair(cust.id, cust.society);
        toast(dates ? "Restored. Visits on " + pretty(dates[0]) + " and " + pretty(dates[1]) + "." : "Route is full.");
      }
      render();
    });
  });
  const reset = document.getElementById("reset");
  if (reset) reset.addEventListener("click", () => { state = seed(); selectedCustomer = null; routeDate = "2026-10-08"; query = ""; toast("Demo data reset."); render(); });
  const routeSel = document.getElementById("route-date");
  if (routeSel) routeSel.addEventListener("change", () => { routeDate = routeSel.value; render(); });
  const fill = document.getElementById("fill");
  if (fill) fill.addEventListener("click", () => {
    let guard = 0;
    while (liveVisits(routeDate).length < CAP && guard < 20) {
      guard += 1;
      const id = uid("c");
      const soc = new Date(routeDate + "T12:00:00").getDay() === 5 ? "Cedar Heights" : "Maple Residency";
      state.customers.push({ id, name: "Slot hold", society: soc, flat: "HOLD-" + guard, plants: 1, access: "Demo hold", status: "hold", note: "Occupies a slot. Not a subscriber.", phone: "" });
      state.visits.push({ id: uid("v"), customerId: id, date: routeDate, status: "scheduled", note: "", water: false, prune: false, pest: false, photo: false, hold: true });
    }
    toast("This day now has " + liveVisits(routeDate).length + " of " + CAP + ".");
    render();
  });
  const clearHolds = document.getElementById("clear-holds");
  if (clearHolds) clearHolds.addEventListener("click", () => {
    const ids = new Set(state.customers.filter((x) => x.status === "hold").map((x) => x.id));
    state.customers = state.customers.filter((x) => !ids.has(x.id));
    state.visits = state.visits.filter((v) => !ids.has(v.customerId));
    toast("Slot holds removed.");
    render();
  });
  const pick = document.getElementById("pick");
  if (pick) pick.addEventListener("change", () => { selectedVisit = pick.value; render(); });
  ["water", "prune", "pest", "photo"].forEach((key) => {
    const el = document.getElementById(key);
    if (el) el.addEventListener("change", () => {
      const v = state.visits.find((x) => x.id === selectedVisit);
      if (v && v.status === "scheduled") v[key] = el.checked;
      save();
    });
  });
  const note = document.getElementById("vnote");
  if (note) note.addEventListener("input", () => {
    const v = state.visits.find((x) => x.id === selectedVisit);
    if (v && v.status === "scheduled") v.note = note.value;
    save();
  });
  const complete = document.getElementById("complete");
  if (complete) complete.addEventListener("click", () => {
    const v = state.visits.find((x) => x.id === selectedVisit);
    if (!v.water || !v.prune || !v.pest || !v.photo || !v.note.trim()) {
      toast("Tick water, prune, pest, and photo, and write the note, before closing.");
      return;
    }
    v.status = "done";
    toast("Visit closed. The note is on the record.");
    render();
  });
  const fail = document.getElementById("fail");
  if (fail) fail.addEventListener("click", () => {
    const v = state.visits.find((x) => x.id === selectedVisit);
    if (!v.note.trim()) { toast("Write what blocked access, then mark it failed."); return; }
    v.status = "failed";
    const who = customer(v.customerId);
    const meta = SOCIETIES[who.society];
    let rebook = null;
    if (meta && who.status === "active") {
      rebook = placeOn(nextWeekday(v.date, meta.day));
      if (rebook) state.visits.push({ id: uid("v"), customerId: who.id, date: rebook, status: "scheduled", note: "", water: false, prune: false, pest: false, photo: false });
    }
    toast(rebook ? "Access failed. Rebooked for " + pretty(rebook) + "." : "Access failed. The next society days are full.");
    render();
  });
}

document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; render(); }));
render();
</script>
</body>
</html>
